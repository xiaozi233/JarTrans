name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Windows 运行器自带显示环境，JavaFX UI 测试无需 monocle/xvfb
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle (with build scan reporting and caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Check (test + spotless + hygiene gate)
        run: .\gradlew.bat check --console=plain

      - name: Package executable fat jar
        run: .\gradlew.bat shadowJar --console=plain

      - name: Upload fat jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jartrans-fat-jar
          path: build/libs/jartrans-*.jar
          if-no-files-found: error
